<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LiDAR scene viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#101216;color:#dfe3ea;font:13px system-ui,sans-serif;overflow:hidden}
  #ui{position:absolute;top:10px;left:10px;background:rgba(20,24,30,.88);padding:10px 12px;border-radius:8px;line-height:1.9}
  #msg{position:absolute;bottom:10px;left:10px;opacity:.8}
  label{display:block;cursor:pointer} select,input[type=range]{vertical-align:middle}
</style></head><body>
<div id="ui"><b>LiDAR scene</b>
  <label><input type="checkbox" id="cPts" checked> Point cloud</label>
  <label><input type="checkbox" id="cMesh" checked> Mesh</label>
  <label><input type="checkbox" id="cPath" checked> Sensor path</label>
  <label>Colour <select id="mode"><option value="height" selected>by height</option><option value="intensity">by intensity</option></select></label>
  <label>Point size <input type="range" id="sz" min="1" max="6" step="0.5" value="2"></label>
  <label>Brightness <input type="range" id="br" min="0.5" max="6" step="0.1" value="1.5"></label>
</div><div id="msg">Loading...</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {PLYLoader} from 'three/addons/loaders/PLYLoader.js';

const msg = document.getElementById('msg');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101216);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.05, 5000);
camera.up.set(0,0,1);                     // data is Z-up
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(30,-20,60); scene.add(sun);

const loader = new PLYLoader();
const load = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));
let pts, mesh, path, intensityCols = null, heightCols = null;

// blue -> cyan -> green -> yellow -> red
function ramp(t){
  t = Math.min(1, Math.max(0, t));
  const s = [[0.1,0.2,0.9],[0.1,0.8,0.9],[0.2,0.9,0.2],[0.95,0.9,0.1],[0.95,0.2,0.1]];
  const f = t*(s.length-1), i = Math.min(s.length-2, Math.floor(f)), u = f-i;
  return s[i].map((v,k)=> v + (s[i+1][k]-v)*u);
}
function buildHeightColours(geo){
  const p = geo.attributes.position, n = p.count, z = new Float32Array(n);
  for(let i=0;i<n;i++) z[i] = p.getZ(i);
  const sorted = Float32Array.from(z).sort();
  const lo = sorted[Math.floor(n*0.02)], hi = sorted[Math.floor(n*0.98)];
  const out = new Float32Array(n*3);
  for(let i=0;i<n;i++){ const c = ramp((z[i]-lo)/(hi-lo||1)); out[3*i]=c[0]; out[3*i+1]=c[1]; out[3*i+2]=c[2]; }
  return out;
}
function setMode(m){
  if(!pts) return;
  const a = pts.geometry.attributes.color;
  if(!a) return;
  const src = (m==='height') ? heightCols : intensityCols;
  a.array.set(src); a.needsUpdate = true;
}

async function main(){
  const errors = [];
  try {
    const g = await load('map_preview.ply');
    if(g.hasAttribute('color')) intensityCols = Float32Array.from(g.attributes.color.array);
    heightCols = buildHeightColours(g);
    if(!intensityCols) intensityCols = heightCols;
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(heightCols), 3));
    pts = new THREE.Points(g, new THREE.PointsMaterial({size:2, sizeAttenuation:false, vertexColors:true}));
    pts.material.color.setScalar(1.5);
    scene.add(pts);
    g.computeBoundingBox();
    const c = new THREE.Vector3(); g.boundingBox.getCenter(c);
    const sz = new THREE.Vector3(); g.boundingBox.getSize(sz);
    const d = Math.max(sz.x, sz.y, sz.z);
    controls.target.copy(c);
    camera.position.set(c.x + d*0.6, c.y - d*0.8, c.z + d*0.6);
    controls.update();
  } catch(e){ errors.push('map_preview.ply'); }
  try {
    const g = await load('mesh_web.ply');
    if(!g.hasAttribute('normal')) g.computeVertexNormals();
    mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors:g.hasAttribute('color'), color:0xdddddd, roughness:.9, metalness:0, side:THREE.DoubleSide}));
    mesh.visible = false;   // start with points; tick "Mesh" to see it
    document.getElementById('cMesh').checked = false;
    scene.add(mesh);
  } catch(e){ errors.push('mesh_web.ply'); }
  try {
    const t = await (await fetch('trajectory.json')).json();
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(t.flat(), 3));
    path = new THREE.Line(g, new THREE.LineBasicMaterial({color:0xffb000}));
    scene.add(path);
  } catch(e){ errors.push('trajectory.json'); }
  msg.textContent = errors.length ? ('Could not load: ' + errors.join(', ') + '  (open via http server, not file://)') : 'Drag = rotate, wheel = zoom, right-drag = pan';
}
main();

const $ = (id)=>document.getElementById(id);
$('cPts').onchange  = e => { if(pts)  pts.visible  = e.target.checked; };
$('cMesh').onchange = e => { if(mesh) mesh.visible = e.target.checked; };
$('cPath').onchange = e => { if(path) path.visible = e.target.checked; };
$('sz').oninput     = e => { if(pts)  pts.material.size = parseFloat(e.target.value); };
$('br').oninput     = e => { if(pts)  pts.material.color.setScalar(parseFloat(e.target.value)); };
$('mode').onchange  = e => setMode(e.target.value);
addEventListener('resize', ()=>{ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script></body></html>
